# Mises à jour automatiques : les actions GitHub (épinglées sur un SHA, Dependabot met à jour le SHA et le commentaire de
# version) et les dépendances Python. PySide6 est plafonné volontairement dans requirements.txt : voir le journal.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "PySide6*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "shiboken6"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
