# Diagnostic ponctuel : rejoue l'audit d'interface sous Windows et Linux et imprime le contexte de plateforme
# (police effective, DPI, chemin qui fixe la largeur minimale de l'inspecteur). Ne se déclenche que lorsque ce fichier
# change ; à supprimer une fois la cause des constats de largeur établie.
name: UI audit diagnostic

on:
  push:
    paths: [".github/workflows/ui-audit-diagnostic.yml"]

permissions:
  contents: read

jobs:
  audit:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install libEGL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Audit 1440x900 + 1180x720
        continue-on-error: true
        run: python -m tools.ui_audit --sizes 1440x900,1180x720 2>&1 | tail -n 60
      - name: Audit 1180x720, polices +20 %
        continue-on-error: true
        run: python -m tools.ui_audit --sizes 1180x720 --font-scale 1.2 2>&1 | tail -n 40
      - name: Fonts installed
        continue-on-error: true
        run: |
          python - <<'PY'
          from PySide6.QtGui import QFontDatabase, QGuiApplication
          app = QGuiApplication([])
          families = sorted(QFontDatabase.families())
          print(len(families), "familles")
          print([f for f in families if f in ("Segoe UI", "Arial", "Helvetica Neue", "SF Pro Text", "DejaVu Sans")])
          print(families[:40])
          PY
