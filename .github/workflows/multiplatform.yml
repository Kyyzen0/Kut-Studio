name: Multiplatform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    # Sous Windows, une suite saine dure de 12 à 26 min selon le runner (du simple au double sur un même commit) : 28 min
    # de job au pire mesuré. 45 min laissent à un test bloqué en fin de suite le temps d'échouer par --timeout, avec son
    # nom, au lieu d'une annulation muette du job (garde : tests/test_ci_workflow.py).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Install FFmpeg and Qt runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy, core)
        if: runner.os == 'Linux'
        run: python -m mypy

      # --timeout : un test qui se bloque (thread ou FFmpeg orphelin) échoue au lieu de geler la CI 30 minutes.
      # -o faulthandler_timeout : 3 min avant, la pile Python de tous les threads du worker part dans le journal. C'est
      # la seule trace d'un blocage natif qui tient le GIL (le minuteur de pytest-timeout ne part pas), et sous xdist
      # pytest-timeout tue le worker sans que sa propre pile n'atteigne le journal. Le test n'est pas interrompu.
      # La couverture n'est mesurée qu'une fois, sur Linux comme mypy : le code propre à macOS / Windows y apparaît
      # non couvert, c'est attendu (docs/coverage.md). Les autres OS lancent la suite sans instrumentation.
      - name: Run test suite (with coverage)
        if: runner.os == 'Linux'
        run: python -m pytest -q -n auto --timeout=600 -o faulthandler_timeout=420 --durations=15 --cov --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml --cov-report=json

      - name: Run test suite
        if: runner.os != 'Linux'
        run: python -m pytest -q -n auto --timeout=600 -o faulthandler_timeout=420 --durations=15

      # Cliquet : le total (lignes + branches) ne descend pas sous tests/coverage_baseline.json. Le texte est gardé
      # pour le résumé de l'exécution, écrit même quand le cliquet échoue (c'est là qu'il sert).
      - name: Coverage ratchet
        if: runner.os == 'Linux'
        shell: bash
        run: python tools/coverage_ratchet.py coverage.json 2>&1 | tee coverage-ratchet.txt

      - name: Coverage summary
        if: ${{ !cancelled() && runner.os == 'Linux' && hashFiles('coverage-ratchet.txt') != '' }}
        shell: bash
        run: |
          {
            echo "### Couverture de code (core/ + ui/)"
            echo '```'
            cat coverage-ratchet.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ runner.os }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: warn
          retention-days: 7

      - name: Source UI smoke test
        run: python main.py --smoke-test

      - name: Build native application
        run: python build.py

      # L'exécutable Windows est une application graphique (--windowed) : PowerShell ne l'attend pas avec « & »
      # et n'en renvoie pas le code de sortie, ce qui rendait ce test vide. Start-Process -Wait -PassThru attend
      # la fin du processus et expose son ExitCode.
      - name: Built application smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\Kut-Studio\Kut-Studio.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          Write-Host "Exit code: $($process.ExitCode)"
          exit $process.ExitCode

      - name: Built application smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./dist/Kut-Studio/Kut-Studio --smoke-test

      - name: Built application smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./dist/Kut-Studio.app/Contents/MacOS/Kut-Studio --smoke-test

      - uses: actions/upload-artifact@v6
        with:
          name: Kut-Studio-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  # Deuxième version majeure de FFmpeg et de Python. La matrice teste FFmpeg 6.1 (Ubuntu) et la dernière version
  # (Homebrew, Chocolatey) sous Python 3.11 ; FFmpeg 7.0 / 7.1 se comporte autrement : ``setpts`` y efface la cadence
  # (xfade refusait toute transition, une sortie rawvideo était remise à 25 i/s) et un puits nourri par une source
  # interne fait avorter ffmpeg. Debian 13 (trixie) fournit FFmpeg 7.1 et Python 3.13 : c'est l'environnement d'un
  # utilisateur Linux récent. La version est vérifiée : une mise à jour de l'image vers une autre majeure fait échouer
  # le job au lieu de lui faire tester autre chose en silence. Bloquant, sans dépendance sur la matrice.
  linux-ffmpeg7:
    name: Debian 13 / FFmpeg 7.1 / Python 3.13
    runs-on: ubuntu-latest
    container: debian:trixie
    # Même règle que la matrice : la suite saine (21 min de job au pire mesuré) plus le --timeout d'un test bloqué.
    timeout-minutes: 45

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      DEBIAN_FRONTEND: noninteractive

    steps:
      # git avant actions/checkout : sans lui l'action télécharge une archive, et les tests qui lisent « git ls-files »
      # n'auraient pas de dépôt. Bibliothèques : ce que PySide6 (QtGui, QtMultimedia) charge en mode offscreen.
      - name: Install FFmpeg, Python and the Qt runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git ffmpeg python3 python3-venv \
            libegl1 libgl1 libglib2.0-0t64 libdbus-1-3 libxkbcommon0 libfontconfig1 fonts-dejavu-core \
            libpulse0 libasound2t64 libva2 libva-drm2 libxrender1 libxi6 libsm6 libx11-6 libx11-xcb1

      - uses: actions/checkout@v5

      - name: Verify FFmpeg 7 and Python 3.13
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="$(ffmpeg -hide_banner -version)"   # pas de « ffmpeg | head » : SIGPIPE + pipefail
          echo "$version" | head -n 1
          python3 --version
          case "$version" in
            "ffmpeg version 7."*) ;;
            *) echo "::error::ce job doit tester FFmpeg 7.x"; exit 1 ;;
          esac
          python3 -c 'import sys; sys.exit(0 if sys.version_info[:2] == (3, 13) else "ce job doit tester Python 3.13")'

      - name: Install Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q -n auto --timeout=600 -o faulthandler_timeout=420 --durations=15 -rfE

  # Couverture réelle des sous-titres (libass) sur macOS. Le FFmpeg Homebrew du job « macos-latest » ci-dessus
  # n'a pas libass : les tests de sous-titres s'y sautent. Ce job installe ffmpeg-full (bouteille de
  # homebrew-core, avec libass), l'expose à l'application et n'exécute que les tests marqués « libass ».
  # KUT_STUDIO_REQUIRE_LIBASS=1 transforme le saut en échec : « vert » veut dire « libass testé », jamais
  # « tout sauté ». Il est volontairement bloquant (pas de continue-on-error) ; choix, mesures à faire et
  # stratégie de repli : docs/ci-libass.md. Aucune dépendance (« needs ») : il n'agit pas sur la matrice.
  macos-libass:
    name: macOS / libass (sous-titres)
    runs-on: macos-latest
    timeout-minutes: 20

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      KUT_STUDIO_REQUIRE_LIBASS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Pas d'actions/cache sur Homebrew : les bouteilles pèsent ~200 Mo déjà compressées (gain nul face à
      # ghcr.io) et un Cellar restauré est fragile. Le coût est la mise en place de ~100 formules : la durée
      # de cette étape est écrite dans le résumé du job pour décider avec des mesures (docs/ci-libass.md).
      - name: Install FFmpeg with libass (Homebrew ffmpeg-full)
        run: |
          started=$SECONDS
          for attempt in 1 2 3; do
            if brew install ffmpeg-full; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::brew install ffmpeg-full a échoué 3 fois"
              exit 1
            fi
            echo "::warning::brew install ffmpeg-full a échoué (tentative $attempt sur 3), nouvel essai dans 20 s"
            sleep 20
          done
          echo "Installation de ffmpeg-full : $((SECONDS - started)) s"
          echo "- Installation de ffmpeg-full : $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"

      # ffmpeg-full est « keg-only » : il n'est pas lié dans /opt/homebrew/bin. L'application le trouve par
      # KUT_STUDIO_FFMPEG / KUT_STUDIO_FFPROBE (core/tool_paths.py) ; le PATH sert aux tests qui lancent « ffmpeg ».
      - name: Expose ffmpeg-full to the application
        run: |
          prefix="$(brew --prefix ffmpeg-full)"
          if [ ! -x "$prefix/bin/ffmpeg" ] || [ ! -x "$prefix/bin/ffprobe" ]; then
            echo "::error::ffmpeg ou ffprobe introuvable dans $prefix/bin"
            exit 1
          fi
          {
            echo "KUT_STUDIO_FFMPEG=$prefix/bin/ffmpeg"
            echo "KUT_STUDIO_FFPROBE=$prefix/bin/ffprobe"
          } >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      # Pas de « cmd | grep -q » : grep quitte au premier résultat et ffmpeg reçoit SIGPIPE.
      - name: Verify the application will use an FFmpeg with libass
        run: |
          echo "ffmpeg du PATH : $(command -v ffmpeg)"
          version="$(ffmpeg -hide_banner -version)"
          echo "$version" | head -n 2
          buildconf="$(ffmpeg -hide_banner -buildconf)"
          filters="$(ffmpeg -hide_banner -filters)"
          if ! grep -Eq '(^|[[:space:]])--enable-libass([[:space:]]|$)' <<< "$buildconf"; then
            echo "::error::ffmpeg -buildconf ne contient pas --enable-libass : ce FFmpeg n'utilise pas libass"
            exit 1
          fi
          if ! grep -Eq '^ *[^ ]+ +subtitles +[^ ]+->' <<< "$filters"; then
            echo "::error::le filtre « subtitles » est absent de ffmpeg -filters"
            exit 1
          fi
          python - <<'EOF'
          import os
          import sys

          from core.tool_paths import find_media_tool

          resolved = find_media_tool("ffmpeg")
          expected = os.path.realpath(os.environ["KUT_STUDIO_FFMPEG"])
          print("ffmpeg résolu par l'application :", resolved)
          if resolved is None or os.path.realpath(resolved) != expected:
              print(f"::error::l'application ne résout pas ffmpeg-full ({expected}) mais {resolved}")
              sys.exit(1)
          EOF
          {
            echo "### FFmpeg des tests de sous-titres"
            echo '```'
            echo "$version" | head -n 2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --timeout : le premier rendu libass construit le cache de polices (fontconfig), lent sur un runner neuf.
      # faulthandler_timeout, sous ce délai : la pile d'un blocage natif, comme pour la matrice ci-dessus.
      - name: Run subtitle tests (libass required)
        run: python -m pytest -q -m libass -rs -p no:cacheprovider --timeout=300 -o faulthandler_timeout=240 --junitxml="$RUNNER_TEMP/libass-junit.xml"

      # Défense en profondeur : même si la variable était retirée, un job où des tests sont sautés ou trop peu
      # nombreux (marque perdue) ne doit pas rester vert.
      - name: Check that libass was really exercised
        run: |
          python - <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET

          MINIMUM_TESTS = 10  # 12 tests « libass » au moment de l'écriture ; à ajuster si on en retire volontairement
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "libass-junit.xml")).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {key: sum(int(suite.get(key, 0)) for suite in suites) for key in ("tests", "skipped", "failures", "errors")}
          line = ", ".join(f"{key}={value}" for key, value in totals.items())
          print("Tests libass :", line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"- Tests libass : {line}\n")
          if totals["skipped"] or totals["failures"] or totals["errors"] or totals["tests"] < MINIMUM_TESTS:
              print(f"::error::libass n'a pas été exercé comme prévu ({line}, minimum {MINIMUM_TESTS} tests, aucun saut)")
              sys.exit(1)
          EOF
