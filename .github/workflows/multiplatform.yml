name: Multiplatform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Install FFmpeg and Qt runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run test suite
        run: python -m pytest -q

      - name: Source UI smoke test
        run: python main.py --smoke-test

      - name: Build native application
        run: python build.py

      - name: Built application smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ".\dist\Kut-Studio\Kut-Studio.exe" --smoke-test'

      - name: Built application smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./dist/Kut-Studio/Kut-Studio --smoke-test

      - name: Built application smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./dist/Kut-Studio.app/Contents/MacOS/Kut-Studio --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: Kut-Studio-${{ runner.os }}
          path: dist/
          if-no-files-found: error
