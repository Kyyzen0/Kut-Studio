# Relecture automatique des PR : Claude commente les erreurs trouvées dans le diff.
# Modèle repris de la doc officielle (section « Run a skill ») :
# https://code.claude.com/docs/en/github-actions
# Lecture seule sur le code : Claude ne pousse rien, il commente.
# La restriction est appliquée au niveau du jeton : on passe GITHUB_TOKEN (limité aux permissions du job ci-dessous)
# via `github_token`. Sans cela, l'action échange l'OIDC contre un jeton d'application GitHub aux droits d'écriture
# par défaut, indépendants du bloc `permissions` du job.
# Sur un dépôt public, GitHub ne transmet pas les secrets aux PR de forks : la relecture ne tourne que sur les branches du dépôt.
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # nécessaire pour poster les commentaires de relecture
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1 (état du 2026-11-03)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Les PR ouvertes par le bot Cursor sont relues aussi ; sans cela l'action refuse (« non-human actor: cursor »).
          allowed_bots: "cursor"
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # 30 tours : une grosse PR (#311) dépassait 15 et faisait échouer le job alors que la relecture était terminée.
          # --allowedTools est requis pour que Claude puisse poster des commentaires en ligne
          claude_args: '--max-turns 30 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
