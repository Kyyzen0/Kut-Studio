name: Deploy Kut-Studio website to Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kut-studio-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Les secrets Cloudflare vivent dans l'environnement « production » (limité à la branche main) : un workflow poussé
    # sur une autre branche ne peut pas les lire.
    environment: production
    steps:
      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the 'production' environment (Settings > Environments > production), not as repository secrets."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # wrangler n'a pas besoin du jeton GitHub
      - name: Deploy existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=kut-studio --branch=main
