[tool.ruff]
extend-exclude = [".venv", "build", "dist", "graphify-out"]

[tool.ruff.lint]
# Règles de correction, sans bruit de style : noms indéfinis et erreurs de syntaxe (E9, F63, F7, F82),
# variables inutilisées (F841, souvent une assertion ou un effet oublié), f-strings sans champ (F541),
# ``raise`` sans chaînage dans un ``except`` (B904).
select = ["E9", "F63", "F7", "F82", "F841", "F541", "B904"]

[tool.mypy]
# Typage progressif : ``core`` est vérifié en entier ; la dette connue est listée ci-dessous.
python_version = "3.11"
files = ["core"]
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true

# Dette de typage connue (erreurs existantes avant la phase de stabilisation).
# RÈGLE : on retire un module de cette liste dès qu'il est propre ; on n'en ajoute jamais.
# Un module nouveau est donc vérifié dès sa création.
[[tool.mypy.overrides]]
module = [
    "core.audio_recorder",
    "core.blend_modes",
    "core.compositing",
    "core.export_engine",
    "core.graphics",
    "core.hardware_cache",
    "core.hardware_encoding",
    "core.lut_importer",
    "core.mograph_ffmpeg",
    "core.mograph_layers",
    "core.mograph_presets",
    "core.mograph_raster",
    "core.mograph_stream",
    "core.render_queue",
    "core.scopes",
    "core.scopes_analyzer",
    "core.visual_effects",
]
ignore_errors = true

[tool.coverage.run]
# Mesure de la couverture (pytest-cov) : jamais dans les options par défaut de pytest, la suite reste rapide sans.
# Commande et cliquet : docs/coverage.md. main.py et build.py sont couverts par les smoke tests de la CI, pas par
# pytest : les mesurer n'apprendrait rien.
source = ["core", "ui"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
skip_empty = true
# S'ajoute aux exclusions par défaut (« # pragma: no cover » reste respecté).
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
